name: Deploy Blog
on:
  push:
    branches: [page]
  repository_dispatch:
    types: [content-update]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch main branch
        run: git fetch origin main:main

      - name: Setup Hugo
        env:
          HUGO_VERSION: 0.160.1
        run: |
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          sudo mv hugo /usr/local/bin/
          hugo version

      - name: Sync posts from main
        run: |
          rm -rf content/posts/
          mkdir -p content/posts
          git archive main -- posts/ | tar -x -C content/ --strip-components=0
          mkdir -p static/images
          git archive main -- posts/images/ 2>/dev/null \
            | tar -x -C static/images --strip-components=2 2>/dev/null \
            || true
          converted=0
          for f in content/posts/*.md; do
            [ -f "$f" ] || continue
            python3 obs2hugo.py "$f" "$f"
            converted=$((converted + 1))
          done
          echo "Synced + converted $converted posts"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
