name: Deploy Blog
on:
  push:
    branches: [main]
    paths:
      - "posts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout posts (main)
        uses: actions/checkout@v4

      - name: Checkout Hugo site (page)
        uses: actions/checkout@v4
        with:
          ref: page
          path: site
          submodules: recursive

      - name: Setup Hugo
        env:
          HUGO_VERSION: 0.160.1
        run: |
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          sudo mv hugo /usr/local/bin/
          hugo version

      - name: Sync posts into site
        run: |
          rm -rf site/content/posts
          mkdir -p site/content/posts site/static/images
          shopt -s nullglob
          posts=(posts/*.md)
          if (( ${#posts[@]} )); then cp "${posts[@]}" site/content/posts/; fi
          if [ -d posts/images ]; then cp -r posts/images/. site/static/images/; fi
          for f in site/content/posts/*.md; do
            python3 site/obs2hugo.py "$f" "$f"
          done
          echo "Synced ${#posts[@]} posts"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: hugo --source site --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
