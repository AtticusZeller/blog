baseURL: https://atticuszeller.github.io/blog/
title: Atticx's Blog
paginate: 10
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: Atticx's Blog
  description: "Research notes, technical writing, and long-form essays on machine learning, robotics, and beyond."
  keywords: [Blog, Machine Learning, Robotics, Research, Embodied AI]
  author: Atticx
  DateFormat: "January 2, 2006"
  defaultTheme: light
  disableThemeToggle: true

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: true
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: true

  assets:
    disableHLJS: true

  label:
    text: "Atticx"

  homeInfoParams:
    Title: "Hi, I'm Atticx"
    Content: >
      Welcome to my research blog. I write about machine learning, robotics,
      and whatever catches my curiosity. Long-form, math-heavy, no fluff.

  socialIcons:
    - name: github
      url: "https://github.com/AtticusZeller"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
            - ['$', '$']
  highlight:
    noClasses: false
    anchorLineNos: false
    codeFences: true
    guessSyntax: false
    lineNos: false
    style: "monokai"

outputs:
  home:
    - HTML
    - RSS
    - JSON

menu:
  main:
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 5
    - identifier: search
      name: Search
      url: /search/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: github
      name: GitHub
      url: "https://github.com/AtticusZeller"
      weight: 30
